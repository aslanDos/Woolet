name: woolet
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  equatable: ^2.1.0
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  internet_connection_checker: ^3.0.1
  shared_preferences: ^2.5.5
  dartz: ^0.10.1
  go_router: ^17.3.0
  adaptive_platform_ui: ^0.1.111
  flutter_lucide: ^1.11.0
  flutter_svg: ^2.3.0
  pie_menu: ^3.8.3
  drift: 2.28.2
  drift_flutter: 0.2.7
  get_it: ^9.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.7.2
  drift_dev: 2.28.2

flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/data/
    - assets/images/
    

  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans/DMSans-Bold.ttf
          weight: 700
        
    
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: assets/images/app_icon.png
  remove_alpha_ios: true
  min_sdk_android: 21
  
